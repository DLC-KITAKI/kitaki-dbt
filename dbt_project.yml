# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'kitaki_dbt'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
profile: 'default'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# --- 重要 ---
# schema名が CWH_CWH / CWH_MRT のように "付与される" のを防ぐため、
# モデルで指定した +schema をそのまま使うようにします。
# （dbt Cloud 側の環境設定で schema name を加工している場合でも、これで抑止できます）
dispatch:
  - macro_namespace: dbt
    search_order: ['kitaki_dbt', 'dbt']

models:
  kitaki_dbt:
    # staging models -> DB_KITAKI.CWH
    staging:
      +schema: CWH
      +materialized: view

    # marts models -> DB_KITAKI.MRT
    marts:
      +schema: MRT
      +materialized: table
